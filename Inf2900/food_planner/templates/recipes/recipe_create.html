{% extends 'base.html' %}

{% block title %} Create Recipe {% endblock %}
{% block page_title %} Create a recipe {% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data">
	{% csrf_token %}
	{{ form.as_p }}
	<p> Ingredients </p>
	<table>
		{{ ingredients }}
	</table>
	<p><input type="submit" value="Save"></p>
</form>
{% endblock %}
