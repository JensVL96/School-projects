{% extends 'base.html' %}
{% block title %} {{ recipe }} {% endblock %}
{% block content %}
<h1> {{ recipe | capfirst }} </h1>
<img src="{{ recipe.image.url }}" alt="{{ recipe }}">
<h2> Ingredients </h2>
<ul>
{% for ingredient in ingredients %}
    <li> {{ ingredient }} </li>
{% endfor %}
</ul>
<h2> Instructions </h2>
{{ recipe.instructions }}
<p>Author: {{ recipe.author }} </p>
{% endblock %}
