{% load static %}
<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head>
  <title> {% block title %} {% endblock %} </title>
  <link rel="stylesheet" href="{% static 'foodplanner.css' %}" type="text/css"/>
  <link rel="stylesheet" href="{% static 'recipes.css' %}" type="text/css"/>
</head>
<body>
  <header> <!--Main header and menu bar-->
    <nav class="menu">
      <ul class="header-list">
        <li><a href="{% url 'home' %}">Home</a></li>
        <li><a href="{% url 'inventory' %}"> Inventory </a></li>
        <li><a href="{% url 'recipes' %}"> Recipes </a></li>
        <li><a href="{% url 'shopping_list' %}"> Shopping list </a></li>
        <li class="dropdown">
          <a href="{% url 'profile' %}"> Profile </a>
          <div class="dropdown-content">
            <a href="{% url 'login' %}"> Login </a>
            <a href="{% url 'signup' %}"> Signup </a>
          </div>
        </li>
        <li class="searchbar">
        	<form action="{% url 'recipe_search' %}" method="get">
			  <input type="search" placeholder="Search recipes..." name="recipe_name" id="id_search">
			  <input type="submit" value="&#x1f50d;">
			</form>
        </li>
      </ul>
	</nav>
  </header>
  <main class="main-content">
	{# Navigation #}
	<div class="title">
	  <h1>{% block page_title %}  {% endblock %}</h1>
	  <hr>
	</div>
	<article>
	  {% block content %}
	  {% endblock %}
	</article>
  </main>
</body>
</html>
