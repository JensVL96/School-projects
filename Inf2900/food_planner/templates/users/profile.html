{% extends 'base.html' %}

{% block title %} Profile {% endblock %}
{% block page_title %} Your profile {% endblock %}

{% block content %}
{% if user.is_authenticated %}
<form method="post">
	{% csrf_token %}
	{{ form.as_p }}
	<input type="submit" value="Save">
</form>
<p><a href="{% url 'delete' %}"> Delete account </a></p>
{% else %}
    <p> Hello world. </p>
{% endif %}
{% endblock %}
