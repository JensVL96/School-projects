{% extends 'base.html' %}

{% block title %} Index {% endblock %}
{% block page_title %} Recipes {% endblock %}

{% if recipes %}
    <ul>
    {% for recipe in recipes %}
        <li><a href="{% url 'recipe_detail' recipe.id %}">{{ recipe.name }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No recipe yet.</p>
    {% endif %}
